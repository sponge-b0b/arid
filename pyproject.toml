[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "arid"
dynamic = ["version"]
description = "Fast Python duplicate-code checker written in Rust. A focused replacement for Pylint R0801 that complements Ruff."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
keywords = [
    "code-duplication",
    "duplicate-code",
    "python",
    "pylint",
    "ruff",
    "rust",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/sponge-b0b/arid"
Issues = "https://github.com/sponge-b0b/arid/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"

[tool.arid]
min-lines = 4
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true
same-file = true
