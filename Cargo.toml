[package]
name = "arid-cli"
version = "1.1.0-rc.1"
edition = "2024"
description = "Fast Python duplicate-code checker written in Rust. A focused replacement for Pylint R0801 that complements Ruff."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/sponge-b0b/arid"
keywords = [
    "code-duplication",
    "duplicate-code",
    "python",
    "pylint",
    "ruff",
]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "arid"
path = "src/lib.rs"

[[bin]]
name = "arid"
path = "src/main.rs"

[dependencies]
atomic-write-file = "0.3.0"
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
toml = "1.1"
thiserror = "2.0"

# Python frontend.
# RustPython currently uses these Ruff-derived parser crates at this tag.
ruff_python_parser = { package = "rustpython-ruff_python_parser", git = "https://github.com/RustPython/ruff.git", tag = "0.15.19-rustpython" }
ruff_python_ast = { package = "rustpython-ruff_python_ast", git = "https://github.com/RustPython/ruff.git", tag = "0.15.19-rustpython" }
ruff_text_size = { package = "rustpython-ruff_text_size", git = "https://github.com/RustPython/ruff.git", tag = "0.15.19-rustpython" }
